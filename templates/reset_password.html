<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SentinelType</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .recovery-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .recovery-card { max-width: 420px; width: 100%; background: rgba(15,23,42,0.75); border: 1px solid rgba(148,163,184,0.15);
    border-radius: 16px; padding: 32px; color: #e2e8f0; }
  .recovery-card h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .recovery-card p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
  .recovery-card input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25);
    background: rgba(255,255,255,0.05); color: #e2e8f0; margin-bottom: 16px; font-size: 1rem; }
  .recovery-card button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #67e8f9;
    color: #0f172a; font-weight: 600; font-size: 1rem; cursor: pointer; }
  .recovery-card button:disabled { opacity: 0.6; cursor: not-allowed; }
  .recovery-card .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 0.9rem; }
  .recovery-card .msg.ok { background: rgba(52,211,153,0.15); color: #34d399; }
  .recovery-card .msg.bad { background: rgba(248,113,113,0.15); color: #f87171; }
  .recovery-card a.back { display: inline-block; margin-top: 18px; color: #67e8f9; font-size: 0.9rem; text-decoration: none; }
</style>
</head>
<body>
<div class="recovery-wrap">
  <div class="recovery-card">
    {% if error %}
      <h1>Link problem</h1>
      <div class="msg bad">{{ error }}</div>
      <a class="back" href="/forgot-password">&larr; Request a new link</a>
    {% else %}
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account. At least 8 characters.</p>
      <form id="resetForm">
        <input type="password" id="password" name="password" placeholder="New password" minlength="8" required>
        <input type="password" id="confirm" name="confirm" placeholder="Confirm new password" minlength="8" required>
        <button type="submit" id="submitBtn">Update password</button>
      </form>
      <div id="result"></div>
      <a class="back" href="/">&larr; Back to login</a>
    {% endif %}
  </div>
</div>
{% if not error %}
<script>
document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const result = document.getElementById("result");
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    result.innerHTML = `<div class="msg bad">Passwords do not match.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Updating...";
  result.innerHTML = "";
  try {
    const res = await fetch("/reset-password/{{ token }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    result.innerHTML = `<div class="msg ${data.success ? "ok" : "bad"}">${data.message}</div>`;
    if (data.success && data.redirect) {
      setTimeout(() => { window.location.href = data.redirect; }, 1500);
    }
  } catch (err) {
    result.innerHTML = `<div class="msg bad">Something went wrong. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Update password";
  }
});
</script>
{% endif %}
</body>
</html>
