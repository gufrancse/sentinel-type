<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelType - Forgot Username</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>SentinelType</h1>
    <p>Recover your username</p>

    <form id="forgotUsernameForm">
        <label>Registered Email</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
        >

        <button type="submit">Send Username</button>
    </form>

    <p id="statusMessage"></p>

    <p>
        <a href="/">Back to Login</a>
    </p>

    <script src="{{ url_for('static', filename='js/forgot_username.js') }}"></script>
</body>
</html>
